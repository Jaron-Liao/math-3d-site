<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="assets/katex/katex-inline.css">

</head>
<body>

<nav class="nav solid">
  <div class="nav-logo"><a href="index.html" style="color:inherit"><b>高等数学</b></a><span>INSIGHTS</span></div>
  <div class="nav-links">
    <a href="lecture.html">讲义</a>

<section class="sec" style="padding-top:104px">
  <div class="sec-head reveal">
    <h2 class="sec-title"><small>Insights</small>数据与来源</h2>
    <p class="sec-desc">右半部分来自 IMA 知识库中的行业研报；左半部分是本站自身的构建指标，全部由数据层实时统计。</p>
  </div>
  <div class="stats reveal" id="stat-cards"></div>
  <div class="bars reveal" id="site-metrics">
    <div style="font-family:var(--serif);font-size:19px;margin-bottom:6px">本站构建指标</div>
    <div id="bars-body"></div>
    <div class="bars-src">统计口径：content/chapters.js 数据层实时计算；行业数据引自 IMA 知识库研报。</div>
  </div>
</section>

<footer class="foot">
  <span>© <span id="year"></span> 高等数学 · 3D Edition</span>
  <a href="index.html">← 返回首页</a>
</footer>

<script src="content/chapters.js"></script>
<script src="js/site.js"></script>
<script>
(function () {
  var S = window.SITE;
  document.getElementById('stat-cards').innerHTML = S.insights.map(function (i) {
    return '<div class="stat"><b>' + i.value + '<i>' + i.unit + '</i></b><span>' + i.label + '</span><em>' + i.src + '</em></div>';
  }).join('');
  var live = S.chapters.filter(function(c){return c.status==='live';}).length;
  var secs = S.chapters.reduce(function(n,c){return n+c.sections.length;},0);
  var forms = S.chapters.reduce(function(n,c){return n+c.formulas.length;},0);
  var models = S.chapters.filter(function(c){return c.model;}).length;
  var rows = [
    { k:'章节总数', v:S.chapters.length, max:10, t:S.chapters.length+' 章' },
    { k:'已完稿正文', v:live, max:10, t:live+' 章' },
    { k:'正文小节', v:secs, max:30, t:secs+' 节' },
    { k:'公式条目', v:forms, max:30, t:forms+' 条' },
    { k:'3D 模型', v:models, max:10, t:models+' 座' }
  ];
  document.getElementById('bars-body').innerHTML = rows.map(function(r){
    return '<div class="bars-row"><span>'+r.k+'</span><i style="width:'+Math.min(100,(r.v/r.max)*100)+'%"></i><b>'+r.t+'</b></div>';
  }).join('');
  var y=document.getElementById('year'); if(y) y.textContent=new Date().getFullYear();
})();
</script>
<script>document.querySelectorAll(".reveal").forEach(function(el){el.classList.add("in")});</script>
</body>
</html>
