<script>
/* 数据渲染（普通脚本，确保即使 3D module 失败也能显示内容） */
(function () {
  var M = window.MODELS || [];
  window.M_MODELS = M;
  var params = new URLSearchParams(location.search);
  var wantId = params.get('id');
  var start = 0;
  if (wantId) {
    var found = M.findIndex(function (m) { return m.id === wantId; });
    if (found >= 0) start = found;
  }
  window.M_IDX = start;
  document.getElementById('m-count').textContent = M.length;
  document.getElementById('m-list').innerHTML = M.map(function (m, i) {
    return '<a class="m-item' + (i === start ? ' on' : '') + '" href="model.html?id=' + m.id + '">'
      + '<span>' + m.cat + '</span><b>' + m.name + '</b></a>';
  }).join('');
  var cur = M[start] || {};
  document.getElementById('m-kicker').textContent = (cur.cat || 'MODEL') + ' · ' + (cur.en || '');
  document.getElementById('m-title').textContent = cur.name || '模型详情';
  document.getElementById('m-cap').textContent = cur.desc || '';
})();
</script>
<script type="module" src="js/model.js"></script>
